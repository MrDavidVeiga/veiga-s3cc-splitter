name: Versão Beta Final 2.0 - validation

on:
  push:
    branches:
      - "beta-final/v2.0.0"
      - "ui/beta-final-2.0-manager-layout-20261022"
      - "ui/beta-final-2.0-title-language-theme-20261022"
    paths:
      - ".github/workflows/splitter-version-validation.yml"
      - "BETA_FINAL.md"
      - "veiga-s3cc-splitter/**"
      - "sims3-core/**"
      - "sims3-pack/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veiga-s3cc-splitter/package-lock.json
      - name: Install frontend dependencies
        working-directory: veiga-s3cc-splitter
        run: npm ci
      - name: Check JavaScript syntax
        working-directory: veiga-s3cc-splitter
        run: |
          node --check src/app.js
          node --check src/winui-theme.js
      - name: Run regression tests
        working-directory: veiga-s3cc-splitter
        run: node --test
      - name: Build frontend
        working-directory: veiga-s3cc-splitter
        run: npm run build

  rust:
    name: Rust workspace checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Run workspace tests
        shell: pwsh
        run: |
          # Avoid a Windows Server 2022 Service Fabric DLL collision that can
          # abort freshly built test executables with STATUS_ENTRYPOINT_NOT_FOUND.
          $serviceFabric = 'C:\Program Files\Microsoft Service Fabric\bin\Fabric\Fabric.Code'
          $pathEntries = $env:PATH -split ';'
          $found = $pathEntries | Where-Object {
            $_.Trim().TrimEnd('\') -ieq $serviceFabric.TrimEnd('\')
          }
          Write-Host "Service Fabric DLL path in PATH: $([bool]$found)"
          $env:PATH = ($pathEntries | Where-Object {
            $_.Trim().TrimEnd('\') -ine $serviceFabric.TrimEnd('\')
          }) -join ';'
          cargo test --workspace
