name: Beta 2 skin name regression verification
on:
  push:
    branches:
      - "fix/beta2-skin-resource-name-recovery-20261102"
    paths:
      - ".github/workflows/beta2-skin-names-validation.yml"
      - "veiga-s3cc-splitter/**"
      - "sims3-core/**"
      - "sims3-pack/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veiga-s3cc-splitter/package-lock.json
      - run: npm ci
        working-directory: veiga-s3cc-splitter
      - run: node --test
        working-directory: veiga-s3cc-splitter
      - run: npm run build
        working-directory: veiga-s3cc-splitter
  rust:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile all crates
        run: cargo check --workspace
      - name: Rust regression tests (remove Service Fabric conflicting DLL path)
        shell: pwsh
        run: |
          $serviceFabric = 'C:\Program Files\Microsoft Service Fabric\bin\Fabric\Fabric.Code'
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_.Trim().TrimEnd('\') -ine $serviceFabric.TrimEnd('\')
          }) -join ';'
          cargo test --workspace
