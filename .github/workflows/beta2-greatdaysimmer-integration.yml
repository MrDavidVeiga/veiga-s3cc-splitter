name: Beta 2 GreatDaySimmer integrated regression

on:
  push:
    branches:
      - "integration/beta2-greatdaysimmer-fixes-20261025"
    paths:
      - ".github/workflows/beta2-greatdaysimmer-integration.yml"
      - "veiga-s3cc-splitter/**"
      - "sims3-core/**"
      - "sims3-pack/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS tests and production build
        working-directory: veiga-s3cc-splitter
        run: |
          npm ci
          node --test src/*.test.mjs
          npm run build

  rust:
    name: Windows Rust integrated regressions
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: veiga-s3cc-splitter/src-tauri -> target
      - name: Compile workspace and test code
        shell: pwsh
        run: |
          cargo check --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Workspace check failed' }
          cargo check --locked --workspace --tests
          if ($LASTEXITCODE -ne 0) { throw 'Workspace test check failed' }

      - name: Test pure binary TONE reader
        shell: pwsh
        run: |
          rustc --edition=2021 --test veiga-s3cc-splitter/src-tauri/src/tone_dependencies.rs -o "$env:RUNNER_TEMP\tone-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'TONE parser compile failed' }
          & "$env:RUNNER_TEMP\tone-tests.exe" --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'TONE parser regression failed' }

      - name: Prepare exact Tauri test harness with Common Controls v6
        shell: pwsh
        run: |
          cargo test --manifest-path veiga-s3cc-splitter/src-tauri/Cargo.toml --locked --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Tauri test harness compile failed' }
          $sdkBin = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $mt = Get-ChildItem -LiteralPath $sdkBin -Filter mt.exe -File -Recurse |
            Where-Object { $_.DirectoryName.EndsWith('\x64') } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK x64 mt.exe not found' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'veiga-integration-tests.manifest'
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity type="win32" name="Veiga.S3CC.Splitter.IntegrationTests" version="1.0.0.0" processorArchitecture="*" />
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $tests = @(Get-ChildItem -LiteralPath 'target\debug\deps' -Filter 'veiga_s3cc_splitter*.exe' -File)
          if ($tests.Count -eq 0) { throw 'No compiled Rust test harness' }
          foreach ($exe in $tests) {
            & $mt.FullName '-nologo' '-manifest' $manifestPath "-outputresource:$($exe.FullName);#1"
            if ($LASTEXITCODE -ne 0) { throw "Manifest embed failed: $($exe.Name)" }
          }

      - name: Run complete Rust integration test suite
        shell: pwsh
        run: |
          $serviceFabric = 'C:\Program Files\Microsoft Service Fabric\bin\Fabric\Fabric.Code'
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_.TrimEnd('\') -ine $serviceFabric.TrimEnd('\')
          }) -join ';'
          cargo test --manifest-path veiga-s3cc-splitter/src-tauri/Cargo.toml --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Integrated Rust regression suite failed' }
