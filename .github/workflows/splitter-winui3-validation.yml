name: Splitter WinUI 3 validation

on:
  push:
    branches:
      - ci/build-v2.4.0-winui3-optimized-theme-20261018
    paths:
      - ".github/workflows/splitter-winui3-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: veiga-s3cc-splitter/package-lock.json
      - name: Install frontend dependencies
        working-directory: veiga-s3cc-splitter
        run: npm ci
      - name: Check JavaScript syntax
        working-directory: veiga-s3cc-splitter
        run: |
          node --check src/app.js
          node --check src/winui-theme.js
      - name: Run all frontend regression tests
        working-directory: veiga-s3cc-splitter
        run: node --test
      - name: Build frontend
        working-directory: veiga-s3cc-splitter
        run: npm run build

  winui-browser:
    name: WinUI 3 theme and layout smoke tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate seven themes across five viewport sizes
        run: python veiga-s3cc-splitter/tests/winui_visual_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Splitter-v2.4.0-WinUI3-visual-audit
          path: veiga-s3cc-splitter/winui-smoke-previews/
          if-no-files-found: ignore
          retention-days: 14

  rust-windows:
    name: Windows Rust workspace checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace
      - name: Run workspace tests
        run: cargo test --workspace
