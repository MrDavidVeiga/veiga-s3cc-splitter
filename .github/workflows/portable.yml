name: portable

run-name: portable by @${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  build-portable-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: veiga-s3cc-splitter/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: veiga-s3cc-splitter
        run: npm ci

      - name: Build portable binary
        working-directory: veiga-s3cc-splitter
        run: npm run tauri build -- --no-bundle

      - name: Locate portable binary
        id: locate_windows
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "target" -Filter "veiga-s3cc-splitter.exe" -Recurse -File |
            Where-Object { $_.FullName -match '\\release\\' -and $_.FullName -notmatch '\\bundle\\' } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $file) {
            Write-Host "Arquivos encontrados em target:"
            Get-ChildItem -Path "target" -Recurse -File | Select-Object FullName
            throw "Portable binary not found."
          }

          "artifact_path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: ${{ steps.locate_windows.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30
