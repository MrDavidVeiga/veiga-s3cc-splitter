name: Portable Builds

run-name: S3CC Splitter v2.2.0 WinUI 3 optimized build with Manager theme parity by @${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "ui/manager-theme-icons-winui3-v2.2.0"
    paths:
      - ".github/workflows/portable.yml"
      - "veiga-s3cc-splitter/**"
      - "sims3-core/**"
      - "sims3-pack/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build-portable:
    name: ${{ matrix.artifact_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: ""
            build_args: --no-bundle
            binary_name: veiga-s3cc-splitter.exe
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-Windows-x64

          - platform: windows-2022
            target: i686-pc-windows-msvc
            build_args: --target i686-pc-windows-msvc --no-bundle
            binary_name: veiga-s3cc-splitter.exe
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-Windows-x86

          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            build_args: --target aarch64-pc-windows-msvc --no-bundle
            binary_name: veiga-s3cc-splitter.exe
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-Windows-ARM64

          - platform: ubuntu-22.04
            target: ""
            build_args: --no-bundle
            binary_name: veiga-s3cc-splitter
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-Linux-x64

          - platform: ubuntu-22.04
            target: i686-unknown-linux-gnu
            build_args: --target i686-unknown-linux-gnu --no-bundle
            binary_name: veiga-s3cc-splitter
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-Linux-x86

          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            build_args: --target aarch64-unknown-linux-gnu --no-bundle
            binary_name: veiga-s3cc-splitter
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-Linux-ARM64

          - platform: macos-15-intel
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin --no-bundle
            binary_name: veiga-s3cc-splitter
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-macOS-Intel

          - platform: macos-15
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin --no-bundle
            binary_name: veiga-s3cc-splitter
            artifact_name: S3CC-Splitter-v2.2.0-WinUI3-macOS-Apple-Silicon

    runs-on: ${{ matrix.platform }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu') && matrix.target != 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Linux x86 dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-i686-linux-gnu \
            g++-i686-linux-gnu \
            pkg-config \
            libwebkit2gtk-4.1-dev:i386 \
            libssl-dev:i386 \
            librsvg2-dev:i386

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: veiga-s3cc-splitter/package-lock.json

      - name: Install Rust stable
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: veiga-s3cc-splitter
        run: npm ci

      - name: Run frontend tests
        working-directory: veiga-s3cc-splitter
        shell: bash
        run: |
          node src/filter-logic.test.mjs
          node src/label-relations.test.mjs
          node src/remove-confirm.test.mjs
          node src/modal.test.mjs

      - name: Check Rust workspace
        if: matrix.target != 'i686-unknown-linux-gnu'
        run: cargo check --workspace

      - name: Run Rust tests
        if: matrix.target != 'i686-unknown-linux-gnu'
        run: cargo test --workspace

      - name: Build portable binary
        if: matrix.target != 'i686-unknown-linux-gnu'
        working-directory: veiga-s3cc-splitter
        run: npm run tauri build -- ${{ matrix.build_args }}

      - name: Build Linux x86 portable binary
        if: matrix.target == 'i686-unknown-linux-gnu'
        working-directory: veiga-s3cc-splitter
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
          CXX_i686_unknown_linux_gnu: i686-linux-gnu-g++
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
        run: npm run tauri build -- ${{ matrix.build_args }}

      - name: Locate Windows binary
        if: startsWith(matrix.platform, 'windows')
        id: locate_windows
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "target" -Filter "${{ matrix.binary_name }}" -Recurse -File |
            Where-Object {
              $_.FullName -match '\\release\\' -and
              $_.FullName -notmatch '\\bundle\\'
            } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $file) {
            Write-Host "Files found in target:"
            Get-ChildItem -Path "target" -Recurse -File | Select-Object FullName
            throw "Portable binary not found."
          }

          "artifact_path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Locate Unix binary
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        id: locate_unix
        shell: bash
        run: |
          set -euo pipefail

          file_path="$(find target -type f -name "${{ matrix.binary_name }}" ! -path "*/bundle/*" | grep "/release/" | head -n 1 || true)"

          if [ -z "$file_path" ]; then
            echo "Files found in target:"
            find target -type f | sort || true
            exit 1
          fi

          echo "artifact_path=$file_path" >> "$GITHUB_OUTPUT"

      - name: Prepare Windows portable package
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $out = Join-Path $PWD "portable/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "${{ steps.locate_windows.outputs.artifact_path }}" (Join-Path $out "${{ matrix.binary_name }}")
          Copy-Item "README.txt" (Join-Path $out "README.txt")
          Copy-Item "LICENSE.txt" (Join-Path $out "LICENSE.txt")

      - name: Prepare Unix portable package
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          out="portable/${{ matrix.artifact_name }}"
          mkdir -p "$out"
          cp "${{ steps.locate_unix.outputs.artifact_path }}" "$out/${{ matrix.binary_name }}"
          cp README.txt "$out/README.txt"
          cp LICENSE.txt "$out/LICENSE.txt"

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: portable/${{ matrix.artifact_name }}/*
          if-no-files-found: error
          retention-days: 30
