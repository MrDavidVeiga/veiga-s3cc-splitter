name: Feature merger validation

on:
  push:
    branches:
      - feature/reversible-merger-manifest

jobs:
  validate-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: veiga-s3cc-splitter/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: veiga-s3cc-splitter
        run: npm ci

      - name: Frontend build
        working-directory: veiga-s3cc-splitter
        run: npm run build

      - name: Cargo check
        run: cargo check --workspace

      - name: Rust tests
        run: cargo test --workspace

      - name: Build Windows portable executable
        working-directory: veiga-s3cc-splitter
        run: npm run tauri build -- --no-bundle

      - name: Locate Windows executable
        id: locate
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "target" -Filter "veiga-s3cc-splitter.exe" -Recurse -File |
            Where-Object { $_.FullName -match '\\release\\' -and $_.FullName -notmatch '\\bundle\\' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $file) { throw "Windows executable not found." }
          "artifact_path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Veigas-S3CC-Splitter-Merger-FolderDrop-Test
          path: ${{ steps.locate.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
