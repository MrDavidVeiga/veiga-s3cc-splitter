name: validate-reversible-merger-backend

on:
  push:
    branches:
      - feature/reversible-merger-manifest

jobs:
  backend:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check -p veiga-s3cc-splitter
      - name: Cargo test
        run: cargo test -p veiga-s3cc-splitter --lib
