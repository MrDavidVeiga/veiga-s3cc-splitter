name: Cancel superseded Splitter CI runs

on:
  push:
    branches:
      - ci/build-v2.4.0-winui3-optimized-theme-20261018
    paths:
      - ".github/workflows/cancel-obsolete-splitter-builds.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-runs:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel duplicate runs while preserving the final source build and validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          keep_runs="39186081360 39186096953"
          obsolete_runs="39185903558 39185975683 39185977712 39185996048 39186075231 39186078409 39185894681 39185993564"
          for run_id in $obsolete_runs; do
            if [[ " $keep_runs " == *" $run_id "* ]]; then
              continue
            fi
            echo "Cancelling superseded run $run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done
